    <linearGradient id="mountain2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#skyGrad)"/>
  
  <!-- Desert Sun -->
  <circle cx="256" cy="180" r="70" fill="#fef08a" opacity="0.9"/>
  
